schemaVersion: 1
stages:
  setup:
    description: Establish project tracker, labels, domain docs, and agent guidance.
    routes:
      - skill: project-bootstrap
        source: orditra
        triggers: [new project, initialize agent config, configure repository]
      - skill: setup-matt-pocock-skills
        source: mattpocock
        requiresMissing: docs/agents
  discovery:
    description: Resolve unclear goals and understand unfamiliar systems.
    routes:
      - skill: workflow-router
        source: orditra
      - skill: ask-matt
        source: mattpocock
      - skill: grill-me
        source: mattpocock
      - skill: prototype
        source: mattpocock
      - skill: large-codebase-map
        source: orditra
  planning:
    description: Turn decisions into a spec and independently grabbable work.
    routes:
      - skill: to-spec
        aliases: [to-prd]
        source: mattpocock
      - skill: to-tickets
        aliases: [to-issues]
        source: mattpocock
      - skill: triage
        source: mattpocock
  implementation:
    description: Build vertical slices with suitable tests and bounded scope.
    routes:
      - skill: implement
        source: mattpocock
      - skill: tdd
        source: mattpocock
      - skill: serena-symbolic-code
        source: orditra
      - skill: structural-code-search
        source: orditra
  diagnosis:
    description: Reproduce, minimize, instrument, fix, and regression-test bugs.
    routes:
      - skill: diagnosing-bugs
        aliases: [diagnose]
        source: mattpocock
  architecture:
    description: Improve module depth, boundaries, and navigability.
    routes:
      - skill: improve-codebase-architecture
        source: mattpocock
      - skill: dependency-architecture
        source: orditra
  verification:
    description: Review behavior, standards, tests, and produced artifacts.
    routes:
      - skill: code-review
        source: mattpocock
      - skill: verification-gate
        source: orditra
      - skill: browser-qa
        source: orditra
  documentation:
    description: Verify current APIs and dependencies against primary documentation.
    routes:
      - skill: current-docs
        source: orditra
  reporting:
    description: Render structured findings into reviewable and machine-readable artifacts.
    routes:
      - skill: evidence-report
        source: orditra
      - skill: performance-report
        source: orditra
  security:
    description: Audit agent components, dependencies, workflows, and external providers.
    routes:
      - skill: agent-supply-chain
        source: orditra
  evaluation:
    description: Verify routing and skill behavior across supported clients.
    routes:
      - skill: verification-gate
        source: orditra
  handoff:
    description: Preserve decisions, state, and next actions across people or sessions.
    routes:
      - skill: handoff
        source: mattpocock
