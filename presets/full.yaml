schemaVersion: 2
name: full
description: Explicit maximum-capability preset; every selected provider is activated and required.
capabilities:
  policies: { mode: always }
  workflow-core: { mode: always }
  external-skills: { mode: always }
  context-protection: { mode: always, provider: context-mode }
  semantic-code: { mode: auto, provider: serena }
  structural-search: { mode: auto, provider: ast-grep }
  current-docs: { mode: auto, provider: context7 }
  repository-map: { mode: auto, provider: repomix, options: { tokenBudget: 2000 } }
  large-code-search: { mode: auto, provider: probe }
  evidence-report: { mode: always }
  visual-export: { mode: auto, provider: d2 }
  browser-qa: { mode: auto, provider: playwright-cli }
  web-performance: { mode: auto, provider: chrome-devtools-mcp }
  dependency-architecture: { mode: auto, provider: dependency-cruiser }
  agent-supply-chain: { mode: auto, provider: agent-scan }
  dependency-vulnerability: { mode: auto, provider: osv-scanner }
  action-security: { mode: auto, provider: zizmor }
  evals: { mode: auto, provider: promptfoo }
  local-knowledge: { mode: auto, provider: qmd }
  github-integration: { mode: auto, provider: github-mcp }
  hardened-mcp: { mode: auto, provider: toolhive }
  deep-security: { mode: auto, provider: semgrep }
  container-security: { mode: auto, provider: trivy }
  code-property-graph: { mode: auto, provider: joern }
  persistent-symbol-graph: { mode: auto, provider: scip }
  telemetry: { mode: auto, provider: opentelemetry }
externalSkillSets:
  - mattpocock-stable
